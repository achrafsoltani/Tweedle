<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90D9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="envelopeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F0F0F0;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="128" cy="128" r="120" fill="url(#bgGrad)"/>

  <!-- Envelope body -->
  <g filter="url(#shadow)">
    <rect x="48" y="80" width="160" height="110" rx="8" ry="8" fill="url(#envelopeGrad)"/>

    <!-- Envelope flap (open) -->
    <path d="M 48 88 L 128 140 L 208 88 L 208 80 Q 208 72 200 72 L 56 72 Q 48 72 48 80 Z"
          fill="#E8E8E8" stroke="#CCCCCC" stroke-width="1"/>

    <!-- Envelope fold lines -->
    <path d="M 48 88 L 128 150 L 208 88"
          fill="none" stroke="#CCCCCC" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Bird silhouette (tweeting bird) -->
  <g transform="translate(128, 115) scale(0.8)">
    <path d="M -25 -15
             C -30 -25, -15 -35, 0 -30
             C 10 -35, 20 -30, 25 -20
             C 35 -20, 40 -10, 35 0
             C 40 5, 35 15, 25 15
             C 20 20, 5 20, -5 15
             C -15 20, -30 15, -35 5
             C -40 0, -35 -10, -25 -15 Z"
          fill="#4A90D9"/>
    <!-- Bird eye -->
    <circle cx="5" cy="-10" r="4" fill="white"/>
    <circle cx="6" cy="-11" r="2" fill="#333"/>
    <!-- Bird beak -->
    <path d="M 25 -5 L 40 -8 L 25 0 Z" fill="#FFB74D"/>
    <!-- Bird wing -->
    <ellipse cx="-10" cy="0" rx="15" ry="8" fill="#357ABD" transform="rotate(-20, -10, 0)"/>
  </g>

  <!-- Decorative mail lines -->
  <g stroke="#357ABD" stroke-width="3" stroke-linecap="round" opacity="0.6">
    <line x1="70" y1="160" x2="130" y2="160"/>
    <line x1="70" y1="172" x2="110" y2="172"/>
  </g>
</svg>
